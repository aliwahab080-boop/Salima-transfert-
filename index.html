<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SALIMA TRANSFERT</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:sans-serif;background:#f5f7fb;max-width:430px;margin:0 auto;padding-bottom:80px}.header{background:#4a148c;color:#fff;padding:14px;display:flex;justify-content:space-between;align-items:center}.header b{letter-spacing:2px}.cacheBtn{background:rgba(255,255,255,.2);border:1px solid #fff;color:#fff;padding:6px 12px;border-radius:20px;font-size:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}.card small{color:#666}.card b{font-size:18px;color:#4a148c}.tabs{display:flex;gap:8px;padding:0 12px;overflow-x:auto}.tab{padding:8px 14px;border-radius:20px;border:1px solid #ddd;background:#fff;white-space:nowrap;font-size:13px}.tab.active{background:#4a148c;color:#fff}.panel{padding:12px}.field{background:#fff;border-radius:14px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 6px rgba(0,0,0,.05)}.field input,.field select{border:none;outline:none;flex:1;font-size:15px;margin-left:8px}.btn{width:100%;padding:16px;background:#4a148c;color:#fff;border:none;border-radius:14px;font-weight:900;font-size:16px;margin:12px 0}.historique{background:#fff;border-radius:14px;padding:12px;margin:12px}.histItem{border-bottom:1px solid #eee;padding:8px 0;font-size:13px;display:flex;justify-content:space-between}.hidden{display:none}.badge{padding:2px 8px;border-radius:10px;font-size:11px}.ok{background:#d4edda}.att{background:#fff3cd}.menu{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #eee}.menu div{text-align:center;font-size:11px;color:#666}.menu b{display:block;font-size:18px}</style></head><body><div class="header"><div><b>• SALIMA •</b><br><small>TRANSFERT D'ARGENT</small></div><div><button class="cacheBtn" onclick="toggleCache()" id="cacheBtn">👁️ CACHÉ</button> <span style="margin-left:8px" onclick="location.href='profile.html'">👤</span></div></div><div class="stats"><div class="card"><small>Solde caché</small><br><b id="solde">•••• FCFA</b><br><small id="soldeDetail" class="hidden">1 250 000 FCFA</small></div><div class="card"><small>Transferts</small><br><b id="count">0</b><br><small>Ce mois</small></div></div><div class="tabs"><button class="tab active" onclick="showTab('envoi')">Envoi</button><button class="tab" onclick="showTab('amana')">Amana</button><button class="tab" onclick="showTab('nita')">Nita</button><button class="tab" onclick="showTab('historique')">Historique</button></div><div id="envoiPanel" class="panel"><div class="field">📍 De <select id="from"><option>Niger 🇳🇪</option><option>Mali 🇲🇱</option><option>Burkina 🇧🇫</option><option>Bénin 🇧🇯</option><option>Nigeria 🇳🇬</option><option>Sénégal 🇸🇳</option><option>Côte d'Ivoire 🇨🇮</option><option>Togo 🇹🇬</option><option>Ghana 🇬🇭</option><option>Cameroun 🇨🇲</option><option>Algérie 🇩🇿</option><option>Maroc 🇲🇦</option><option>France 🇫🇷</option><option>USA 🇺🇸</option><option>Canada 🇨🇦</option><option>Allemagne 🇩🇪</option><option>Italie 🇮🇹</option><option>Espagne 🇪🇸</option><option>Belgique 🇧🇪</option><option>UK 🇬🇧</option><option>Arabie 🇸🇦</option><option>Turquie 🇹🇷</option><option>Chine 🇨🇳</option><option>Dubai 🇦🇪</option><option>Libye 🇱🇾</option><option>Tchad 🇹🇩</option></select></div><div class="field">🎯 Vers <select id="to"><option>Niger 🇳🇪</option><option>Mali 🇲🇱</option><option>Burkina 🇧🇫</option><option>Bénin 🇧🇯</option><option>Nigeria 🇳🇬</option><option>Sénégal 🇸🇳</option><option>Côte d'Ivoire 🇨🇮</option><option>Togo 🇹🇬</option><option>Ghana 🇬🇭</option><option>Cameroun 🇨🇲</option><option>Algérie 🇩🇿</option><option>Maroc 🇲🇦</option><option>France 🇫🇷</option><option>USA 🇺🇸</option><option>Canada 🇨🇦</option><option>Allemagne 🇩🇪</option><option>Italie 🇮🇹</option><option>Espagne 🇪🇸</option><option>Belgique 🇧🇪</option><option>UK 🇬🇧</option><option>Arabie 🇸🇦</option><option>Turquie 🇹🇷</option><option>Chine 🇨🇳</option><option>Dubai 🇦🇪</option><option>Libye 🇱🇾</option><option>Tchad 🇹🇩</option></select></div><div class="field">💰 <input id="montant" type="number" placeholder="Montant" oninput="calc()"><span>FCFA</span></div><div class="field"><span>Frais</span><span id="frais">0 FCFA</span></div><div class="field"><span>Total</span><b id="total">0 FCFA</b></div><div class="field">📞 <input id="dest" placeholder="Numéro destinataire +227"></div><button class="btn" onclick="envoyer()">Envoyer avec SALIMA 💜</button></div><div id="amanaPanel" class="panel hidden"><h3>Transfert Amana</h3><div class="field">💰 <input placeholder="Montant Amana"></div><div class="field">📞 <input placeholder="Numéro Amana"></div><button class="btn" onclick="alert('Transfert Amana simulé ✅')">Envoyer Amana</button></div><div id="nitaPanel" class="panel hidden"><h3>Transfert Nita</h3><div class="field">💰 <input placeholder="Montant Nita"></div><div class="field">📞 <input placeholder="Numéro Nita"></div><button class="btn" onclick="alert('Transfert Nita simulé ✅')">Envoyer Nita</button></div><div id="historiquePanel" class="panel hidden"><div class="historique" id="histList"><i>Aucun transfert</i></div></div><div class="menu"><div onclick="showTab('envoi')"><b>🏠</b>Accueil</div><div onclick="showTab('historique')"><b>📜</b>Historique</div><div onclick="location.href='profile.html'"><b>👤</b>Profil</div><div onclick="location.href='https://wa.me/22799963777'"><b>💬</b>Aide</div></div><script>let cache=true;let hist=JSON.parse(localStorage.getItem('salima_hist')||'[]');function toggleCache(){cache=!cache;document.getElementById('solde').innerText=cache?'•••• FCFA':'1 250 000 FCFA';document.getElementById('soldeDetail').classList.toggle('hidden',cache);document.getElementById('cacheBtn').innerText=cache?'👁️ CACHÉ':'👁️ VISIBLE'}function showTab(t){document.querySelectorAll('.panel').forEach(p=>p.classList.add('hidden'));document.getElementById(t+'Panel').classList.remove('hidden');document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'))}function calc(){let m=parseInt(document.getElementById('montant').value)||0;let f=m>0?Math.max(500,Math.round(m*0.02)):0;document.getElementById('frais').innerText=f+' FCFA';document.getElementById('total').innerText=(m+f)+' FCFA'}function envoyer(){let m=document.getElementById('montant').value;let to=document.getElementById('to').value;let dest=document.getElementById('dest').value;if(!m){alert('Mets montant');return}let item={montant:m,to:to,dest:dest,date:new Date().toLocaleString()};hist.unshift(item);localStorage.setItem('salima_hist',JSON.stringify(hist));renderHist();document.getElementById('count').innerText=hist.length;alert('✅ '+m+' FCFA vers '+to+' ('+dest+')\nCommission Salima: '+document.getElementById('frais').innerText)}function renderHist(){let h=document.getElementById('histList');if(hist.length==0){h.innerHTML='<i>Aucun transfert</i>';return}h.innerHTML=hist.map(x=>`<div class=histItem><span>${x.montant} FCFA → ${x.to} <br><small>${x.dest} - ${x.date}</small></span><span class="badge ok">OK</span></div>`).join('')}renderHist();document.getElementById('count').innerText=hist.length;if(!localStorage.getItem('salima_user')){location.href='login.html'}</script></body></html>
