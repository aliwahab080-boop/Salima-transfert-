<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Salima V14.1 FIX</title><link rel="manifest" href="manifest.json"><style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#000;color:#fff}.lock{position:fixed;inset:0;background:#000;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}.dots{display:flex;gap:12px;margin:20px}.dot{width:18px;height:18px;border:2px solid #7ab800;border-radius:50%}.dot.fill{background:#7ab800}.numpad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;width:260px}.num{background:#1a1a1a;border:1px solid #333;border-radius:50%;width:70px;height:70px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;cursor:pointer;user-select:none}.num:active{background:#7ab800;color:#000}.btn{width:100%;padding:14px;border-radius:12px;border:0;background:#7ab800;color:#000;font-weight:800;margin-top:10px}.modal{position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:10000;display:none;align-items:center;justify-content:center;padding:20px}input{width:100%;padding:13px;border-radius:10px;border:1px solid #333;background:#000;color:#fff;margin-bottom:8px}.ok{padding:10px;border-radius:8px;background:#0a2a00;color:#7ab800;display:none;margin-top:8px}.lang{position:absolute;top:20px;right:20px;background:#1a1a1a;border:1px solid #333;border-radius:20px;padding:6px 12px;font-size:12px;cursor:pointer}</style></head><body>
<div class="lock" id="lockScreen">
<div class="lang" onclick="cycleLang()">🌍 <span id="langLabel">FR</span></div>
<div style="width:80px;height:80px;background:linear-gradient(135deg,#a8d800,#7ab800);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:50px;font-weight:900;color:#fff" onclick="emergencyReset()">S</div>
<h2 style="color:#7ab800;margin:10px 0 0">SALIMA</h2><small style="color:#888">WALLET OFFICIEL</small>
<p id="lockText" style="color:#888;font-size:14px;margin-top:10px;text-align:center">Crée ton code à 4 chiffres</p>
<div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
<div class="numpad">
<div class="num" onclick="tapNum(1)">1</div><div class="num" onclick="tapNum(2)">2</div><div class="num" onclick="tapNum(3)">3</div>
<div class="num" onclick="tapNum(4)">4</div><div class="num" onclick="tapNum(5)">5</div><div class="num" onclick="tapNum(6)">6</div>
<div class="num" onclick="tapNum(7)">7</div><div class="num" onclick="tapNum(8)">8</div><div class="num" onclick="tapNum(9)">9</div>
<div class="num" style="visibility:hidden"></div><div class="num" onclick="tapNum(0)">0</div><div class="num" onclick="delNum()">⌫</div>
</div>
<p style="font-size:13px;color:#7ab800;margin-top:18px;cursor:pointer;text-decoration:underline" onclick="openForgot()">Mot de passe oublié ?</p>
<p style="font-size:11px;color:#555;margin-top:6px" id="lockHint">Wallet sécurisé Pi - Clique S 5x si bloqué</p>
<p style="font-size:12px;color:#ff4444;display:none" id="lockError"></p>
</div>
<div class="modal" id="forgotModal"><div style="background:#111;border:2px solid #7ab800;border-radius:16px;padding:20px;width:100%;max-width:320px"><h3 style="color:#7ab800;margin-top:0">Mot de passe oublié</h3><p style="font-size:13px;color:#888">Tape 99963777</p><input id="forgotTel" placeholder="99963777"><input id="forgotNewCode" placeholder="Nouveau code 4 chiffres" type="number" style="display:none"><div id="forgotMsg" class="ok"></div><button class="btn" onclick="verifyForgot()" id="forgotBtn">Vérifier</button><button class="btn" style="background:#222;color:#fff" onclick="closeForgot()">Annuler</button></div></div>
<div id="appContent" style="display:none;padding:20px"><h2 style="color:#7ab800">Wallet ouvert !</h2><p>Solde: <span id="soldeTxt">250 000 FCFA</span></p><button class="btn" onclick="lockApp()">🔒 Re-verrouiller pour tester</button><button class="btn" style="background:#222;color:#fff" onclick="location.href='./index.html'">Retour complet V14</button></div>
<script>
let inputCode='',savedCode=localStorage.getItem('salima_code'),isSettingNew=false,tempNewCode='',forgotStep=1,resetClick=0;
const urlParams=new URLSearchParams(window.location.search);
if(urlParams.get('reset')=='1'){localStorage.removeItem('salima_code');savedCode=null;alert('Code réinitialisé ! Crée un nouveau code maintenant');}
function updateDots(){document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('fill',i<inputCode.length));}
function tapNum(n){if(inputCode.length>=4)return;inputCode+=n;updateDots();if(inputCode.length==4)setTimeout(checkCode,200);}
function delNum(){inputCode=inputCode.slice(0,-1);updateDots();document.getElementById('lockError').style.display='none';}
function checkCode(){const lockText=document.getElementById('lockText');if(!savedCode){if(!isSettingNew){tempNewCode=inputCode;inputCode='';isSettingNew=true;lockText.innerText='Confirme ton code';updateDots();}else{if(inputCode==tempNewCode){localStorage.setItem('salima_code',inputCode);savedCode=inputCode;openApp();}else{document.getElementById('lockError').style.display='block';document.getElementById('lockError').innerText='❌ Pas pareil, recommence';tempNewCode='';isSettingNew=false;inputCode='';lockText.innerText='Crée ton code à 4 chiffres';updateDots();}}}else{if(inputCode==savedCode){openApp();}else{document.getElementById('lockError').style.display='block';document.getElementById('lockError').innerText='❌ Code incorrect, essaie Mot de passe oublié';inputCode='';updateDots();}}}
function openApp(){document.getElementById('lockScreen').style.display='none';document.getElementById('appContent').style.display='block';const fullApp=`./index.html?v=${Date.now()}`;setTimeout(()=>{window.location.href=fullApp;},500);}
function lockApp(){document.getElementById('lockScreen').style.display='flex';document.getElementById('appContent').style.display='none';inputCode='';isSettingNew=false;document.getElementById('lockText').innerText=savedCode?'Entre ton code pour ouvrir':'Crée ton code à 4 chiffres';updateDots();}
function emergencyReset(){resetClick++;if(resetClick>=5){if(confirm('Débloquer le wallet ? Le code va être effacé')){localStorage.removeItem('salima_code');savedCode=null;resetClick=0;lockApp();}}setTimeout(()=>resetClick=0,2000);}
function openForgot(){document.getElementById('forgotModal').style.display='flex';forgotStep=1;document.getElementById('forgotTel').style.display='block';document.getElementById('forgotNewCode').style.display='none';}
function closeForgot(){document.getElementById('forgotModal').style.display='none';}
function verifyForgot(){const tel=document.getElementById('forgotTel').value.trim();const msg=document.getElementById('forgotMsg');msg.style.display='block';if(forgotStep==1){if(tel=='99963777'||tel=='9996'||tel.includes('99963777')||tel.length>=4){msg.innerText='✅ OK, entre nouveau code 4 chiffres';document.getElementById('forgotTel').style.display='none';document.getElementById('forgotNewCode').style.display='block';document.getElementById('forgotBtn').innerText='Réinitialiser';forgotStep=2;}else{msg.innerText='❌ Tape 99963777';}}else{const newCode=document.getElementById('forgotNewCode').value;if(newCode.length!=4){msg.innerText='❌ 4 chiffres obligatoires';return;}localStorage.setItem('salima_code',newCode);savedCode=newCode;msg.innerText='✅ Code changé: '+newCode;setTimeout(()=>{closeForgot();openApp();},800);}}
function cycleLang(){}
if(!savedCode){document.getElementById('lockText').innerText='Crée ton code à 4 chiffres - Tape 4 chiffres';}else{document.getElementById('lockText').innerText='Entre ton code pour ouvrir';}
updateDots();
</script></body></html>
