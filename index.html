<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SALIMA V18</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#7ab800">
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{margin:0;background:#000;color:#fff}
.header{background:#7ab800;padding:14px;color:#000;font-weight:900}
.solde{font-size:28px;font-weight:900}
.greenCard{background:#0f0f0f;border:1px solid #222;border-radius:18px;padding:12px;margin:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.svc{background:#121212;border:1px solid #222;border-radius:16px;padding:18px;text-align:center;cursor:pointer}
.btn{width:100%;padding:12px;border-radius:12px;border:0;background:#7ab800;color:#000;font-weight:900;margin-top:8px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#000;color:#fff;margin:6px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;display:none;align-items:center;justify-content:center;padding:16px}
.box{background:#111;border:2px solid #7ab800;border-radius:16px;padding:16px;width:100%;max-width:360px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0a0a0a;border-top:1px solid #222;display:flex;justify-content:space-around;padding:10px}
.hide{filter:blur(8px)}
</style>
</head>
<body>

<div class="header">
<small id="txtSolde">Solde disponible</small>
<div class="solde"><span id="soldeTxt">250 000 FCFA</span> <span onclick="toggleSolde()">👁️</span><br><small id="piStatus" style="font-size:11px">Pi: Non connecté</small></div>
<select id="langSelect" onchange="changeLang(this.value)">
<option value="FR">🇫🇷 FR</option><option value="EN">🇬🇧 EN</option><option value="AR">🇸🇦 AR</option><option value="HA">🇳🇪 HA</option><option value="ES">🇪🇸 ES</option><option value="ZH">🇨🇳 中文</option>
</select>
<select id="paysSelect" onchange="changePays(this.value)">
<option value="NE">Niger - FCFA</option><option value="NG">Nigeria - NGN</option><option value="FR">France - EUR</option><option value="US">USA - USD</option><option value="DZ">Algerie - DZD</option><option value="GH">Ghana - GHS</option>
</select>
</div>

<div class="greenCard">
<b>Services Salima</b>
<div class="grid" style="margin-top:10px">
<div class="svc" onclick="openSvc('Salima')">Salima</div>
<div class="svc" onclick="openSvc('NITA')">NITA</div>
<div class="svc" onclick="openSvc('Amana')">Amana</div>
<div class="svc" onclick="openSvc('Moi-Même')">Moi-Même</div>
<div class="svc" onclick="openSvc('Airtel')">Airtel</div>
<div class="svc" onclick="openSvc('Moov')">Moov</div>
<div class="svc" onclick="openSvc('NIGELEC')">NIGELEC</div>
<div class="svc" onclick="openSvc('Encaisser')">Encaisser</div>
</div>
<button class="btn" style="background:#6a00ff;color:#fff" onclick="connectPi()">Système Pi - Connecter</button>
<button class="btn" style="background:#ffa500" onclick="location.href='./revenus.html'">Revenus Option C</button>
</div>

<div class="greenCard" id="recusCard"><b>Reçus</b><div id="recusList" style="font-size:12px"></div></div>

<div class="nav"><b>Accueil</b><span onclick="showTab('recus')">Reçus</span><span>Profil</span></div>

<div class="modal" id="svcModal"><div class="box"><h3 id="svcTitle" style="color:#7ab800"></h3><input id="svcNum" placeholder="Numéro"><input id="svcMont" placeholder="Montant" type="number"><div id="svcMsg" style="color:#7ab800"></div><button class="btn" onclick="doTransfer()">Confirmer</button><button class="btn" style="background:#222;color:#fff" onclick="closeSvc()">Annuler</button></div></div>

<script src="./app.js"></script>
</body>
  </html>
