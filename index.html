<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salima V9 - Niger Complet + Reçus + Pi</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7ab800">
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{margin:0;background:#000;color:#fff;padding-bottom:90px}
.header{background:#111;padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}
.bal{font-size:22px;font-weight:900;color:#7ab800}
.card{background:#111;border:1px solid #222;border-radius:16px;margin:12px;padding:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.srv{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:14px;padding:12px;text-align:center;cursor:pointer}
.srv b{font-size:11px;display:block;margin-top:6px}
.btn{width:100%;padding:14px;border-radius:12px;border:0;background:#7ab800;color:#000;font-weight:800;font-size:15px;cursor:pointer;margin-top:8px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#000;color:#fff;margin-bottom:8px}
.ok{margin-top:8px;padding:10px;border-radius:8px;background:#0a2a00;color:#7ab800;display:none;font-size:13px}
.tab{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222;display:flex;padding:8px}
.tab div{flex:1;text-align:center;padding:10px;font-size:12px;cursor:pointer}
.tab .act{color:#7ab800;font-weight:800}
.receipt{background:#fff;color:#000;padding:16px;border-radius:12px;margin-top:10px}
</style>
</head>
<body>
<div class="header">
<div>
<div style="font-size:11px;color:#888">Solde disponible</div>
<div class="bal"><span id="soldeTxt">250 000 FCFA</span> <span style="cursor:pointer" onclick="toggleSolde()">👁️</span></div>
<div style="font-size:11px;color:#888" id="piName">Pi: Non connecté</div>
</div>
<div style="width:42px;height:42px;background:#7ab800;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900" onclick="showPage('profil')">A</div>
</div>

<div id="pageAccueil">
<div class="card">
<label style="font-size:12px;color:#7ab800">📍 VILLE / VILLAGE DU NIGER - 8 Régions (Tape pour chercher)</label>
<input list="villagesList" id="villeInput" placeholder="Tape: Niamey, Zinder, Agadez, Tillaberi...">
<datalist id="villagesList">
<option value="NIAMEY - Commune 1"><option value="NIAMEY - Commune 2"><option value="NIAMEY - Commune 3"><option value="NIAMEY - Commune 4"><option value="NIAMEY - Commune 5">
<option value="AGADEZ - Agadez"><option value="AGADEZ - Arlit"><option value="AGADEZ - Bilma"><option value="AGADEZ - Iférouane"><option value="AGADEZ - Ingall"><option value="AGADEZ - Tchirozérine"><option value="AGADEZ - Dirkou"><option value="AGADEZ - Timia"><option value="AGADEZ - Tabelot">
<option value="DIFFA - Diffa"><option value="DIFFA - N'Guigmi"><option value="DIFFA - Mainé-Soroa"><option value="DIFFA - Bosso"><option value="DIFFA - Goudoumaria">
<option value="DOSSO - Dosso"><option value="DOSSO - Birni N'Gaouré"><option value="DOSSO - Dogondoutchi"><option value="DOSSO - Gaya"><option value="DOSSO - Loga"><option value="DOSSO - Tibiri"><option value="DOSSO - Dioundiou"><option value="DOSSO - Falmey">
<option value="MARADI - Maradi"><option value="MARADI - Aguié"><option value="MARADI - Dakoro"><option value="MARADI - Guidan Roumdji"><option value="MARADI - Madarounfa"><option value="MARADI - Mayahi"><option value="MARADI - Tessaoua"><option value="MARADI - Gazaoua"><option value="MARADI - Bermo"><option value="MARADI - Chadakori">
<option value="TAHOUA - Tahoua"><option value="TAHOUA - Abalak"><option value="TAHOUA - Birni N'Konni"><option value="TAHOUA - Bouza"><option value="TAHOUA - Illéla"><option value="TAHOUA - Keita"><option value="TAHOUA - Madaoua"><option value="TAHOUA - Tchintabaraden"><option value="TAHOUA - Tillia">
<option value="TILLABERI - Tillabéri"><option value="TILLABERI - Abala"><option value="TILLABERI - Ayérou"><option value="TILLABERI - Banibangou"><option value="TILLABERI - Bankilaré"><option value="TILLABERI - Filingué"><option value="TILLABERI - Gothèye"><option value="TILLABERI - Kollo"><option value="TILLABERI - Ouallam"><option value="TILLABERI - Say"><option value="TILLABERI - Téra"><option value="TILLABERI - Torodi"><option value="TILLABERI - Baleyara"><option value="TILLABERI - Kouré"><option value="TILLABERI - Karma"><option value="TILLABERI - Namaro">
<option value="ZINDER - Zinder C1"><option value="ZINDER - Zinder C2"><option value="ZINDER - Zinder C3"><option value="ZINDER - Zinder C4"><option value="ZINDER - Zinder C5"><option value="ZINDER - Mirriah"><option value="ZINDER - Gouré"><option value="ZINDER - Magaria"><option value="ZINDER - Matameye"><option value="ZINDER - Tanout"><option value="ZINDER - Takeita"><option value="ZINDER - Dungass"><option value="ZINDER - Kantché"><option value="ZINDER - Belbedji"><option value="ZINDER - Damagaram Takaya">
</datalist>
</div>

<div class="card">
<b>🚀 Services Salima</b>
<div class="grid" style="margin-top:10px">
<div class="srv" onclick="openForm('salima')">💸<b>Salima</b></div>
<div class="srv" onclick="openForm('nita')">🏦<b>NITA</b></div>
<div class="srv" onclick="openForm('amana')">🏦<b>Amana</b></div>
<div class="srv" onclick="openForm('moi')">🔄<b>Moi-Même</b></div>
<div class="srv" onclick="openForm('airtel')">📱<b>Airtel</b></div>
<div class="srv" onclick="openForm('moov')">📱<b>Moov</b></div>
<div class="srv" onclick="openForm('zamani')">📱<b>Zamani</b></div>
<div class="srv" onclick="openForm('sahel')">📱<b>SahelCom</b></div>
<div class="srv" onclick="openForm('nigelec')">💡<b>NIGELEC</b></div>
<div class="srv" onclick="openForm('encaisser')">💵<b>Encaisser</b></div>
</div>
</div>

<div class="card" id="formCard" style="display:none">
<h3 id="formTitle" style="margin:0 0 10px;color:#7ab800"></h3>
<input id="f1" placeholder="Numéro / Code / Compteur">
<input id="f2" type="number" placeholder="Montant FCFA">
<button class="btn" onclick="validerEnvoi()">Valider et Générer Reçu 🧾</button>
<div id="fMsg" class="ok"></div>
</div>

<div class="card">
<button class="btn" style="background:#6a1b9a;color:#fff" onclick="connectPi()">π Connecter Pi Wallet</button>
<div id="piMsg" class="ok"></div>
</div>
</div>

<div id="pageRecus" style="display:none">
<div class="card"><b>🧾 Mes Reçus</b><div id="listRecus" style="margin-top:10px"></div></div>
<div class="card" id="detailRecu" style="display:none"></div>
</div>

<div id="pageProfil" style="display:none">
<div class="card"><b>👤 Profil Client</b><p style="font-size:12px;color:#888">Nom: ALI WAHAB<br>Num: 99963777<br>Pi: <span id="profilPi">Non connecté</span><br>Ville: <span id="profilVille">Niamey</span></p><button class="btn" style="background:#222;color:#fff" onclick="toggleSolde()">👁️ Cacher / Montrer solde</button></div>
</div>

<div class="tab"><div class="act" onclick="showPage('accueil')" id="tAcc">Accueil</div><div onclick="showPage('recus')" id="tRec">Reçus</div><div onclick="showPage('profil')" id="tProf">Profil</div></div>

<script>
let soldeVisible=true;let solde=250000;let transactions=JSON.parse(localStorage.getItem('salima_tx')||'[]');let currentService='';let piUser=null;try{Pi.init({version:"2.0",sandbox:true});}catch(e){}
function toggleSolde(){soldeVisible=!soldeVisible;document.getElementById('soldeTxt').innerText=soldeVisible?solde.toLocaleString()+' FCFA':'••••••';}
function showPage(p){document.getElementById('pageAccueil').style.display=p=='accueil'?'block':'none';document.getElementById('pageRecus').style.display=p=='recus'?'block':'none';document.getElementById('pageProfil').style.display=p=='profil'?'block':'none';document.getElementById('tAcc').className=p=='accueil'?'act':'';document.getElementById('tRec').className=p=='recus'?'act':'';document.getElementById('tProf').className=p=='profil'?'act':'';if(p=='recus')renderRecus();}
function openForm(type){currentService=type;document.getElementById('formCard').style.display='block';const titles={salima:'Transfert Salima',nita:'Envoi NITA',amana:'Envoi Amana',moi:'Moi-même Compte à compte',airtel:'Achat Crédit Airtel',moov:'Achat Crédit Moov',zamani:'Achat Crédit Zamani',sahel:'Achat Crédit SahelCom',nigelec:'Payer Facture NIGELEC',encaisser:'Encaisser Retrait'};document.getElementById('formTitle').innerText=titles[type];}
function validerEnvoi(){const ville=document.getElementById('villeInput').value;const num=document.getElementById('f1').value;const mont=parseInt(document.getElementById('f2').value);const msg=document.getElementById('fMsg');msg.style.display='block';if(!num||!mont){msg.innerText='❌ Remplis tout';return;}const frais=Math.floor(mont*0.01);const tx={id:'SAL'+Date.now(),date:new Date().toLocaleString(),service:currentService,ville:ville,num:num,montant:mont,frais:frais,total:mont+frais,status:'Succès',pi:piUser?.username||'local'};transactions.unshift(tx);localStorage.setItem('salima_tx',JSON.stringify(transactions));solde-=tx.total;document.getElementById('soldeTxt').innerText=soldeVisible?solde.toLocaleString()+' FCFA':'••••••';document.getElementById('profilVille').innerText=ville||'Niamey';msg.innerHTML='✅ Succès! '+mont+' FCFA vers '+num+' ('+ville+')<br>ID: '+tx.id+'<br><button class="btn" onclick="showPage(\'recus\')">Voir Reçu 🧾</button>';document.getElementById('f1').value='';document.getElementById('f2').value='';}
function renderRecus(){const list=document.getElementById('listRecus');if(transactions.length==0){list.innerHTML='<p style="color:#888;font-size:12px">Aucun reçu</p>';return;}list.innerHTML=transactions.map((tx,i)=>`<div style="background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer" onclick="openRecu(${i})"><b style="color:#7ab800">${tx.service.toUpperCase()} - ${tx.montant} FCFA</b><br><span style="font-size:11px;color:#888">${tx.date} | ${tx.id}<br>Ville: ${tx.ville} | Vers: ${tx.num}</span><br><span style="font-size:11px;color:#0f0">${tx.status}</span></div>`).join('');}
function openRecu(i){const tx=transactions[i];const d=document.getElementById('detailRecu');d.style.display='block';d.innerHTML=`<div class="receipt"><center><b>SALIMA TRANSFERT</b><br><small>Reçu officiel Pi Sécurisé</small><hr></center><b>ID:</b> ${tx.id}<br><b>Date:</b> ${tx.date}<br><b>Ville:</b> ${tx.ville}<br><b>Service:</b> ${tx.service}<br><b>Destinataire:</b> ${tx.num}<br><b>Montant:</b> ${tx.montant} FCFA<br><b>Frais:</b> ${tx.frais}<br><b>Total:</b> ${tx.total} FCFA<br><b>Statut:</b> ${tx.status}<hr><center><button class="btn" style="background:#000;color:#fff" onclick="partagerRecu(${i})">Partager WhatsApp</button></center></div>`;}
function partagerRecu(i){const tx=transactions[i];const texte=`*REÇU SALIMA*%0AID: ${tx.id}%0ADate: ${tx.date}%0AVille: ${tx.ville}%0AService: ${tx.service}%0AMontant: ${tx.montant} FCFA%0AVers: ${tx.num}`;window.open('https://wa.me/?text='+texte,'_blank');}
async function connectPi(){const msg=document.getElementById('piMsg');msg.style.display='block';msg.innerText='⏳ Connexion Pi... (Ouvre dans Pi Browser)';try{const auth=await Pi.authenticate(['username','payments','wallet_address'],()=>{});piUser=auth.user;document.getElementById('piName').innerText='Pi: @'+auth.user.username;document.getElementById('profilPi').innerText='@'+auth.user.username;msg.innerText='✅ Pi Connecté: @'+auth.user.username;}catch(e){msg.innerText='❌ '+e.message;}}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script>
</body>
  </html>
