<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salima Transfert</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f8f7ff] min-h-screen">
  <div class="bg-white p-4 flex items-center gap-3 shadow-sm">
    <div class="w-12 h-12 bg-[#5b21b6] rounded-full flex items-center justify-center text-white font-bold">S</div>
    <div><h1 class="font-bold text-[#5b21b6]">Salima</h1><p class="text-xs text-gray-500">transfert international</p></div>
  </div>
  <div class="p-6">
    <div class="bg-gradient-to-br from-[#5b21b6] to-[#7c3aed] rounded-[24px] p-6 text-white">
      <h2 class="text-2xl font-bold">Transfert d'argent<br>rapide & sécurisé</h2>
      <p class="text-sm opacity-80 mt-2">Niger 🇳🇪 → Monde entier avec Pi</p>
    </div>
    <div class="bg-white rounded-[20px] p-5 mt-5 shadow-sm">
      <h3 class="font-bold">Envoyer de l'argent</h3>
      <label class="text-xs text-gray-500 mt-4 block">Montant FCFA</label>
      <input id="amount" type="number" value="10000" class="w-full mt-1 border-2 border-gray-100 rounded-xl p-3 font-bold">
      <label class="text-xs text-gray-500 mt-4 block">Destination</label>
      <select id="country" class="w-full mt-1 border-2 border-gray-100 rounded-xl p-3 text-sm">
        <option>Bénin</option><option>Togo</option><option>Burkina</option><option>Sénégal</option><option>France</option>
      </select>
      <div id="piAmount" class="mt-3 bg-[#f3f0ff] rounded-xl p-3 font-bold text-[#5b21b6] text-center">~ 0.65 Pi</div>
      <label class="text-xs text-gray-500 mt-4 block">Numéro bénéficiaire</label>
      <input id="phone" type="tel" class="w-full mt-1 border-2 border-gray-100 rounded-xl p-3" placeholder="+229...">
      <button id="payBtn" class="w-full mt-6 bg-[#5b21b6] text-white font-bold py-4 rounded-xl">Payer avec Pi</button>
      <p id="status" class="text-xs text-center mt-3 text-gray-400">Paiement sécurisé Pi SDK</p>
    </div>
  </div>
<script>
  const Pi = window.Pi; try{Pi.init({version:"2.0", sandbox:true})}catch(e){}
  const amount=document.getElementById('amount'), piEl=document.getElementById('piAmount'), btn=document.getElementById('payBtn'), st=document.getElementById('status');
  const RATE=15400;
  function upd(){const f=parseFloat(amount.value)||0; const p=(f/RATE).toFixed(2); piEl.textContent='~ '+p+' Pi'; btn.textContent='Payer avec Pi - '+p+' Pi';}
  amount.addEventListener('input',upd); upd();
  btn.addEventListener('click', async()=>{
    const f=parseFloat(amount.value)||0; const pi=parseFloat((f/RATE).toFixed(2));
    st.textContent='Connexion Pi Wallet...';
    try{
      const auth=await Pi.authenticate(['payments'],()=>{});
      st.textContent='Salut '+auth.user.username;
      await Pi.createPayment({amount:pi, memo:'Salima Transfert', metadata:{phone:document.getElementById('phone').value}},{
        onReadyForServerApproval:id=>st.textContent='Approbation '+id,
        onReadyForServerCompletion:(id,tx)=>{st.textContent='✅ Réussi TX:'+tx; alert('Transfert réussi!');},
        onCancel:()=>st.textContent='Annulé', onError:e=>st.textContent='Erreur '+e
      });
    }catch(e){ st.textContent='Mode démo - Ouvre dans Pi Browser: '+pi+' Pi'; }
  });
</script>
</body>
    </html>
