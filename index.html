<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salima</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f2f3f8}.top{background:#4b1f8a;color:#fff;padding:12px;text-align:center;font-weight:bold}.head{background:#fff;padding:20px;text-align:center;border-bottom:5px solid #4b1f8a}.head h1{color:#4b1f8a;font-size:30px}.btn-main{max-width:920px;margin:12px auto;display:block;background:#16a34a;color:#fff;padding:16px;border-radius:14px;text-align:center;font-weight:bold;font-size:18px;border:none;width:90%}.btn-main.logout{background:#ef4444}.grid{max-width:920px;margin:10px auto;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}.card{background:#fff;border-radius:18px;padding:18px;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.07);border-left:6px solid #4b1f8a}.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:99;justify-content:center;align-items:center;padding:20px}.modal.active{display:flex}.modal-box{background:#fff;width:100%;max-width:400px;border-radius:20px;padding:20px}.modal-box h2{color:#4b1f8a;text-align:center}.modal-box input,.modal-box select{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #ddd}.modal-box button{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:none;background:#4b1f8a;color:#fff;font-weight:bold}.close{float:right;font-size:22px;cursor:pointer}.foot{background:#111;color:#aaa;text-align:center;padding:15px;font-size:11px;margin-top:20px}</style></head><body><div class="top">SALIMA TRANSFERT - Niamey 99 96 37 77</div><div class="head"><h1>Salima Transfert</h1><p id="userInfo">Pour tous vos transactions<br><b>Non connecté</b></p></div><button id="authBtn" class="btn-main" onclick="handleAuth()">Se connecter</button><div class="grid"><div class="card" onclick="openModal('historique')"><div style="font-size:32px">📜</div><b>Historique</b></div><div class="card" onclick="openModal('commission')"><div style="font-size:32px">💰</div><b>Commission</b></div><div class="card" onclick="openModal('profil')"><div style="font-size:32px">👤</div><b>Profil</b></div><div class="card" onclick="openModal('envoyer')"><div style="font-size:32px">💸</div><b>Envoyer</b></div></div><div id="historique" class="modal" onclick="closeModal('historique')"><div class="modal-box" onclick="event.stopPropagation()"><span class="close" onclick="closeModal('historique')">×</span><h2>Historique</h2><p id="histList" style="text-align:center;margin-top:20px">Aucune transaction</p></div></div><div id="commission" class="modal" onclick="closeModal('commission')"><div class="modal-box" onclick="event.stopPropagation()"><span class="close" onclick="closeModal('commission')">×</span><h2>Commission</h2><div style="background:#f0fdf4;padding:15px;border-radius:12px;margin-top:15px;text-align:center"><b style="font-size:28px;color:#16a34a">0 FCFA</b></div><button onclick="closeModal('commission')">Fermer</button></div></div><div id="profil" class="modal" onclick="closeModal('profil')"><div class="modal-box" onclick="event.stopPropagation()"><span class="close" onclick="closeModal('profil')">×</span><h2>Profil</h2><p id="pName" style="margin-top:10px">Non connecté</p><p id="pStatus">Déconnecté</p><button onclick="closeModal('profil')">Fermer</button></div></div><div id="envoyer" class="modal" onclick="closeModal('envoyer')"><div class="modal-box" onclick="event.stopPropagation()"><span class="close" onclick="closeModal('envoyer')">×</span><h2>Envoyer</h2><select id="service"><option>NITA</option><option>AMANA</option><option>AIRTEL MONEY</option><option>MOOV MONEY</option><option>ZAMANI</option><option>NIGELEC</option><option>NDE</option></select><input id="montant" type="number" placeholder="Montant FCFA"><input id="dest" type="text" placeholder="Numéro destinataire"><p id="frais" style="color:#16a34a;font-size:12px"></p><button onclick="doEnvoi()">Envoyer</button></div></div><div class="foot">Salima Transfert 2026 - Tous boutons OK</div><script>let currentUser=JSON.parse(localStorage.getItem('salima_user')||'null');function updateUI(){const btn=document.getElementById('authBtn');const info=document.getElementById('userInfo');if(currentUser){btn.innerText='Se déconnecter ('+currentUser.username+')';btn.classList.add('logout');info.innerHTML='Bienvenue<br><b>@'+currentUser.username+' ✅</b>';document.getElementById('pName').innerText='@'+currentUser.username;document.getElementById('pStatus').innerText='Connecté ✅';}else{btn.innerText='Se connecter';btn.classList.remove('logout');info.innerHTML='Pour tous vos transactions<br><b>Non connecté</b>';document.getElementById('pName').innerText='Non connecté';document.getElementById('pStatus').innerText='Déconnecté';}}updateUI();function handleAuth(){if(currentUser){if(confirm('Tu veux te déconnecter ?')){localStorage.removeItem('salima_user');currentUser=null;updateUI();alert('Déconnecté !');}}else{let name=prompt('Entre ton nom pour te connecter:');if(name&&name.trim()!=''){currentUser={username:name.trim()};localStorage.setItem('salima_user',JSON.stringify(currentUser));updateUI();alert('Bienvenue '+name+' !');}}}function openModal(id){document.getElementById(id).classList.add('active')}function closeModal(id){document.getElementById(id).classList.remove('active')}document.getElementById('montant')?.addEventListener('input',function(){let m=parseInt(this.value)||0;let f=Math.round(m*0.01);document.getElementById('frais').innerText=m>0?'Frais: '+f+' FCFA | Reçoit: '+(m-f)+' FCFA':'';});function doEnvoi(){let s=document.getElementById('service').value;let m=document.getElementById('montant').value;let d=document.getElementById('dest').value;if(!m||!d){alert('Remplis montant et numéro');return}let hist=JSON.parse(localStorage.getItem('salima_hist')||'[]');hist.unshift({service:s,montant:m,dest:d,date:new Date().toLocaleString()});localStorage.setItem('salima_hist',JSON.stringify(hist));alert('Envoi '+m+' FCFA via '+s+' vers '+d+' réussi !');closeModal('envoyer');showHist();}function showHist(){let hist=JSON.parse(localStorage.getItem('salima_hist')||'[]');let el=document.getElementById('histList');if(hist.length==0){el.innerHTML='Aucune transaction';return}el.innerHTML=hist.map(h=>`<div style="border-bottom:1px solid #eee;padding:8px 0;text-align:left"><b>${h.service}</b> - ${h.montant} FCFA<br><small>${h.dest} - ${h.date}</small></div>`).join('');}showHist();</script></body></html>
