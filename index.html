<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Salima International</title><style>body{font-family:sans-serif;max-width:430px;margin:0 auto;background:#f5f6fb;padding:0 0 100px}.header{background:#C62828;color:#fff;padding:18px 16px 38px;border-radius:0 0 24px 24px}.solde{background:#fff;margin:-26px 16px 0;padding:14px;border-radius:18px;box-shadow:0 6px 20px rgba(0,0,0,.12)}.badge{background:#d4edda;color:#155724;padding:6px 12px;border-radius:20px;font-size:11px;margin:10px 16px;display:inline-block}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 16px}.item{background:#fff;border-radius:14px;padding:12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06);border:2px solid #0ab26a}.btn{background:#5b21b6;color:#fff;width:calc(100% - 32px);margin:12px 16px;padding:15px;border:none;border-radius:14px;font-weight:900}.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);z-index:99;align-items:center;justify-content:center;padding:12px}.modalBox{background:#fff;width:100%;max-width:400px;padding:18px;border-radius:20px}.modalBox input,.modalBox select{width:100%;padding:11px;margin:7px 0;border:1px solid #ccc;border-radius:10px}.nav{position:fixed;bottom:0;max-width:430px;width:100%;background:#fff;display:flex;justify-content:space-around;padding:9px 0;border-top:1px solid #eee}</style></head><body><div class="header"><h2 style="margin:0">Salima Transfert<br>International ALI</h2><small>+22799963777 - Pi + Nita + Amana</small></div><div class="solde"><b>Solde: 3 986 000 XOF = 124,56 Pi</b><br><small>Réf dernier: STALI-ENC-95254 (50 000 XOF)</small></div><div class="badge">✅ Pi • International • Historique auto</div><div class="grid"><button class="item" onclick="openModal('nitaModal')">🔄<br><b>Salima → Nita</b></button><button class="item" onclick="openModal('recevoirModal')" style="border-color:#C62828">📥<br><b>Nita → Salima</b></button><button class="item" onclick="openModal('interModal')" style="border-color:#1565c0">🌍<br><b>International</b></button><button class="item" onclick="location.href='menu.html'" style="border-color:#FFD700">🕒<br><b>Historique</b></button></div><button class="btn" onclick="openModal('interModal')">🌍 Envoyer International</button><div id="nitaModal" class="modal" onclick="closeAll()"><div class="modalBox" onclick="event.stopPropagation()"><h3>Salima → Nita/Amana</h3><select id="destType"><option>Amana Banque</option><option>Nita</option></select><input id="destNum" placeholder="Numéro"><input id="montantNita" type="number" placeholder="Montant XOF"><button style="width:100%;padding:14px;background:#0ab26a;color:#fff;border:none;border-radius:12px;font-weight:800" onclick="envoyerNita()">Envoyer</button></div></div><div id="recevoirModal" class="modal" onclick="closeAll()"><div class="modalBox" onclick="event.stopPropagation()"><h3>Nita → Salima</h3><input id="codeNita" placeholder="Code Nita"><input id="montantRecu" type="number" placeholder="Montant XOF"><button style="width:100%;padding:14px;background:#0ab26a;color:#fff;border:none;border-radius:12px;font-weight:800" onclick="recevoirNita()">Encaisser 50 000 XOF test</button></div></div><div id="interModal" class="modal" onclick="closeAll()"><div class="modalBox" onclick="event.stopPropagation()"><h3>🌍 International</h3><select id="pays"><option value="BJ">Bénin XOF</option><option value="NG">Nigeria NGN</option><option value="GH">Ghana GHS</option><option value="FR">France EUR</option><option value="US">USA USD</option></select><input id="nomInter" placeholder="Nom bénéficiaire"><input id="montantInter" type="number" placeholder="Montant XOF"><div id="recuInter" style="background:#f0eaff;padding:8px;border-radius:8px;margin:8px 0">Reçoit: 0</div><button style="width:100%;padding:14px;background:#0ab26a;color:#fff;border:none;border-radius:12px;font-weight:800" onclick="envoyerInter()">Envoyer International</button></div></div><div class="nav"><div onclick="location.reload()">🏠<br>Accueil</div><div onclick="location.href='menu.html'" style="color:#0ab26a;font-weight:800">🕒<br>Histo</div><div>💳<br>Visa</div><div>👤<br>Profil</div></div><script>function openModal(id){document.getElementById(id).style.display='flex'}function closeAll(){document.querySelectorAll('.modal').forEach(m=>m.style.display='none')}function saveHist(o){let h=JSON.parse(localStorage.getItem('salima_history')||'[]');h.unshift(o);localStorage.setItem('salima_history',JSON.stringify(h.slice(0,100)))}document.getElementById('montantInter').addEventListener('input',function(){let m=parseFloat(this.value)||0;let frais=Math.max(1000,m*0.02);let recu=m-frais;let pays=document.getElementById('pays').value;let txt=recu+' XOF';if(pays=='NG')txt=(recu/45).toFixed(0)+' NGN';if(pays=='GH')txt=(recu/52).toFixed(0)+' GHS';if(pays=='FR')txt=(recu/655).toFixed(2)+' EUR';if(pays=='US')txt=(recu/600).toFixed(2)+' USD';document.getElementById('recuInter').innerText='Reçoit: '+txt+' | Frais: '+frais+' XOF';});function envoyerNita(){let m=document.getElementById('montantNita').value;let ref='STALI-'+Date.now().toString().slice(-6);saveHist({date:new Date().toLocaleString(),type:'Salima→'+document.getElementById('destType').value,num:document.getElementById('destNum').value,montant:m+' XOF',ref:ref});alert('✅ Envoyé '+m+' XOF Réf:'+ref);closeAll()}function recevoirNita(){let m=document.getElementById('montantRecu').value;let code=document.getElementById('codeNita').value;let ref='STALI-ENC-'+Date.now().toString().slice(-5);saveHist({date:new Date().toLocaleString(),type:'Nita→Salima',num:code,montant:'+ '+m+' XOF',ref:ref});alert('✅ NITA→SALIMA Code '+code+' encaissé: '+m+' XOF Réf:'+ref);closeAll()}function envoyerInter(){let m=document.getElementById('montantInter').value;let pays=document.getElementById('pays').options[document.getElementById('pays').selectedIndex].text;let ref='STALI-INT-'+Date.now().toString().slice(-5);saveHist({date:new Date().toLocaleString(),type:'International→'+pays,num:document.getElementById('nomInter').value,montant:m+' XOF → '+document.getElementById('recuInter').innerText,ref:ref});alert('🌍 International '+m+' XOF vers '+pays+' Réf:'+ref);closeAll()}</script></body></html>
