<!DOCTYPE html><html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SALIMA V21 FINAL - No Lock</title>
<style>*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:system-ui}
.h{background:#7ab800;color:#000;padding:16px} .s{font-size:32px;font-weight:900}
.card{background:#111;border:1px solid #222;border-radius:18px;margin:12px;padding:14px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.b{background:#1a1a1a;border:1px solid #333;border-radius:14px;padding:18px;text-align:center;font-weight:700}
.btn{width:100%;background:#7ab800;border:0;padding:14px;border-radius:12px;font-weight:900;color:#000;margin-top:10px}
.recu{background:#1e1e1e;border-radius:10px;padding:10px;margin:8px 0;font-size:13px;border-left:4px solid #7ab800}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99;align-items:center;justify-content:center;padding:15px}
#modal.on{display:flex}.m{background:#111;border:1px solid #444;border-radius:16px;padding:16px;width:100%;max-width:360px}
.m input{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#000;color:#fff;margin:6px 0}
</style></head><body>
<div class="h"><small>Solde disponible</small><div class="s" id="solde">250 000 FCFA</div>
<div style="font-weight:700;font-size:13px">V21 FINAL - Sans code - Direct Wallet</div></div>
<div class="card"><b>Services Salima V21</b><div class="g">
<div class="b" onclick="openS('Salima')">Salima</div><div class="b" onclick="openS('NITA')">NITA</div>
<div class="b" onclick="openS('Amana')">Amana</div><div class="b" onclick="openS('Moi-Même')">Moi-Même</div>
<div class="b" onclick="openS('Airtel')">Airtel Money</div><div class="b" onclick="openS('Moov')">Moov Money</div>
<div class="b" onclick="openS('NIGELEC')">NIGELEC</div><div class="b" onclick="openS('Encaisser')" style="border-color:#7ab800">Encaisser</div>
</div></div>
<div class="card"><b>Reçus</b><div id="list"><small style="opacity:.6">Clique un service pour commencer</small></div>
<button class="btn" style="background:#222;color:#fff;border:1px solid #333" onclick="clearAll()">Effacer</button></div>
<div id="modal"><div class="m"><b id="mTitle">Service</b><br><br>
Numéro<input id="num" placeholder="90123456">Montant<input id="mont" type="number" placeholder="5000">
<div style="display:flex;gap:8px;margin-top:10px">
<button class="btn" style="background:#333;color:#fff" onclick="closeM()">Annuler</button>
<button class="btn" onclick="doTrans()">VALIDER</button></div></div></div>
<script>
let solde=parseInt(localStorage.getItem('sal_v21_solde')||'250000');let cur='';
function refresh(){document.getElementById('solde').innerText=solde.toLocaleString('fr-FR')+' FCFA';localStorage.setItem('sal_v21_solde',solde);load();}
function openS(n){cur=n;document.getElementById('mTitle').innerText=n;document.getElementById('modal').classList.add('on');}
function closeM(){document.getElementById('modal').classList.remove('on');}
function doTrans(){let num=document.getElementById('num').value.trim();let m=parseInt(document.getElementById('mont').value);
if(!num||!m)return alert('Numéro + montant');if(cur!=='Encaisser'&&m>solde)return alert('Solde insuffisant');
if(cur==='Encaisser')solde+=m;else solde-=m;let r={s:cur,n:num,m:m,d:new Date().toLocaleString('fr-FR')};
let arr=JSON.parse(localStorage.getItem('sal_v21_recus')||'[]');arr.unshift(r);localStorage.setItem('sal_v21_recus',JSON.stringify(arr));
refresh();closeM();document.getElementById('num').value='';document.getElementById('mont').value='';}
function load(){let arr=JSON.parse(localStorage.getItem('sal_v21_recus')||'[]');let z=document.getElementById('list');
if(!arr.length){z.innerHTML='<small style="opacity:.6">Clique un service pour commencer</small>';return;}
z.innerHTML=arr.map(r=>`<div class="recu"><b>${r.s}</b> - ${r.m.toLocaleString()} FCFA<br>${r.n}<br><small>${r.d}</small></div>`).join('');}
function clearAll(){if(confirm('Effacer tout?')){localStorage.clear();solde=250000;refresh();}}refresh();
</script></body></html>
