<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salima Transfert</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8BC34A">
<style>
body{margin:0;font-family:sans-serif;background:linear-gradient(135deg,#C5E86C,#8BC34A);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.card{background:white;border-radius:20px;padding:30px 20px;width:90%;max-width:350px;box-shadow:0 10px 25px rgba(0,0,0,0.15);text-align:center}
.logo{width:120px;height:120px;border-radius:25px;object-fit:cover;margin-bottom:15px}
h1{color:#33691E} p{color:#689F38}
.btn-main{background:linear-gradient(135deg,#C5E86C,#8BC34A);border:none;padding:14px 25px;border-radius:30px;color:white;font-weight:bold;font-size:16px;width:100%;margin-top:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.grid button{background:#F1F8E9;border:1px solid #C5E86C;padding:12px;border-radius:15px;color:#33691E;font-weight:600}
</style>
</head>
<body>
<div class="card">
<img src="icon-192.png" class="logo">
<h1>Salima Transfert</h1>
<p>Transfert rapide et sécurisé</p>
<button class="btn-main">Se connecter</button>
<div class="grid">
<button>Historique</button>
<button>Commission</button>
<button>Profil</button>
<button>Envoyer</button>
</div>
</div>
</body>
  </html>
