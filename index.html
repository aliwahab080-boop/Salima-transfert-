<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SALIMA V30</title><script src="https://sdk.minepi.com/pi-sdk.js"></script><style>*{box-sizing:border-box;margin:0}body{background:#000;color:#fff;font-family:system-ui}.h{background:linear-gradient(135deg,#7ab800,#5a8a00);color:#000;padding:16px;position:sticky;top:0;z-index:30}.s{font-size:32px;font-weight:900;display:flex;align-items:center;gap:10px}.pill{background:rgba(0,0,0,.2);padding:5px 10px;border-radius:20px;font-size:11px;font-weight:800;margin:2px;display:inline-block}.pill.pi{background:#000;color:#7aff7a;border:1px solid #7aff7a}.card{background:#111;border:1px solid #222;border-radius:20px;margin:10px;padding:14px}.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.b{background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:16px;text-align:center;font-weight:700;cursor:pointer}.b.green{border-color:#7ab800;color:#7ab800}.tabs{display:flex;gap:6px;margin-bottom:10px}.tab{flex:1;padding:10px;border-radius:10px;text-align:center;background:#1a1a1a;border:1px solid #333;font-weight:800;font-size:12px}.tab.on{background:#7ab800;color:#000}select,input{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#000;color:#fff;margin:5px 0}#modal{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:100;display:none;align-items:center;justify-content:center;padding:12px}#modal.on{display:flex}.m{background:#121212;border:1px solid #444;border-radius:18px;padding:16px;width:100%;max-width:400px;max-height:92vh;overflow:auto}#receiptView{display:none;position:fixed;inset:0;background:#000;z-index:300;padding:10px;overflow:auto}#receiptView.on{display:block}.wrap{max-width:420px;margin:0 auto;background:#0a1f0a;border:2px solid #1a4a1a;border-radius:22px;padding:10px}.topOk{background:#c8f5c8;color:#0a3a0a;border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #222;font-size:13px}.btn{width:100%;background:#7ab800;border:0;padding:14px;border-radius:12px;font-weight:900;color:#000;margin-top:8px}</style></head><body>
<div class="h"><small style="font-weight:800;opacity:.7">SOLDE DISPONIBLE - V30</small><div class="s"><span id="soldeTxt">250 000 FCFA</span><span style="margin-left:auto;font-size:11px;background:#000;padding:6px 10px;border-radius:20px" onclick="localStorage.clear();location.reload()">RESET</span></div><div style="margin-top:6px"><span class="pill pi" id="piStatus">● Pi: Prêt</span><span class="pill" id="locPill">📍 Niamey - Aéroport</span><span class="pill" id="nbT">0 transac</span></div></div>
<div class="card"><div class="tabs"><div class="tab on" id="tabW" onclick="switchTab('wallet')">🏠 Wallet</div><div class="tab" id="tabP" onclick="switchTab('pays')">🌍 Villages</div><div class="tab" id="tabR" onclick="switchTab('profil')">👤 Profil</div></div>
<div id="viewWallet"><div class="g"><div class="b" onclick="openS('Salima')">Salima</div><div class="b" onclick="openS('NITA')">NITA</div><div class="b" onclick="openS('Amana')">Amana</div><div class="b" onclick="openS('Airtel Money')">Airtel</div><div class="b" onclick="openS('Moov Money')">Moov</div><div class="b" onclick="openS('Zamani')">Zamani</div><div class="b" onclick="openS('NIGELEC')">NIGELEC ⚡</div><div class="b" onclick="openS('SEEN')">SEEN 💧</div><div class="b green" onclick="openS('Encaisser')">Encaisser +</div></div><div style="margin-top:12px"><b>Derniers reçus</b><div id="list" style="margin-top:8px"></div></div></div>
<div id="viewPays" style="display:none"><select id="regionSel" onchange="updateDepts()"></select><select id="deptSel" onchange="updateVillages()"></select><select id="villageSel" onchange="saveLoc()"></select><div id="locInfo" style="font-size:12px;margin-top:8px"></div><button class="btn" onclick="saveLoc();switchTab('wallet')">✓ Valider village</button></div>
<div id="viewProfil" style="display:none"><h3>👤 Profil</h3><input id="profName" placeholder="Nom"><input id="profPhone" placeholder="Tél"><input id="profVillage" placeholder="Village"><button class="btn" onclick="saveProfile()">💾 Sauver</button><button class="btn" style="background:#222;color:#fff;border:1px solid #444" onclick="localStorage.clear();alert('Tout nettoyé - recharge');location.reload()">🧹 Tout Reset (si bloqué)</button></div></div>
<div id="modal"><div class="m"><div style="display:flex;justify-content:space-between"><b id="mTitle"></b><b onclick="closeM()">✕</b></div><input id="num" placeholder="Numéro"><input id="mont" type="number" placeholder="Montant"><div id="calc" style="font-size:12px;margin:6px 0"></div><button class="btn" onclick="doTrans()">VALIDER ✓</button></div></div>
<div id="receiptView"><div class="wrap"><div class="topOk"><div style="background:#158a15;color:#fff;width:36px;height:36px;border-radius:50%;display:grid;place-items:center">✓</div><div><b>Transaction réussie</b><br><small id="rSub"></small></div></div><div style="background:#0f0f0f;border-radius:14px;padding:14px;margin-top:10px;font-size:13px" id="rDetail"></div><button class="btn" onclick="document.getElementById('receiptView').classList.remove('on')">Fermer</button></div></div>
<script>
const NIGER_DATA={"Agadez":{depts:["Arlit","Bilma"],villages:["Agadez","Arlit"]},"Dosso":{depts:["Dosso","Gaya"],villages:["Dosso","Gaya"]},"Maradi":{depts:["Madarounfa"],villages:["Maradi"]},"Niamey":{depts:["Niamey I","Niamey II"],villages:["Gamkalley","Yantala","Lazaret","Boukoki","Wadata","Talladjé","Koira Kano","Goudel","Lamordé","Saga","Aéroport"]},"Tillabéri":{depts:["Tillabéri"],villages:["Tillabéri"]},"Zinder":{depts:["Zinder"],villages:["Zinder"]}};
let solde=parseInt(localStorage.getItem('sal_v27_solde')||'250000');let currentLoc=JSON.parse(localStorage.getItem('currentLoc')||'{"region":"Niamey","village":"Aéroport"}');let cur='';let piUser=null;
function init(){let rSel=document.getElementById('regionSel');rSel.innerHTML=Object.keys(NIGER_DATA).map(r=>`<option ${r===currentLoc.region?'selected':''}>${r}</option>`).join('');updateDepts();refresh();updateLocPill();}
function updateDepts(){let region=document.getElementById('regionSel').value;let depts=NIGER_DATA[region]?.depts||[];document.getElementById('deptSel').innerHTML=depts.map(d=>`<option>${d}</option>`).join('');updateVillages();}
function updateVillages(){let region=document.getElementById('regionSel').value;let villages=NIGER_DATA[region]?.villages||[];document.getElementById('villageSel').innerHTML=villages.map(v=>`<option ${v===currentLoc.village?'selected':''}>${v}</option>`).join('');}
function saveLoc(){let region=document.getElementById('regionSel').value;let village=document.getElementById('villageSel').value;currentLoc={region,village};localStorage.setItem('currentLoc',JSON.stringify(currentLoc));updateLocPill();}
function updateLocPill(){document.getElementById('locPill').innerText=`📍 ${currentLoc.region} - ${currentLoc.village}`;}
function switchTab(t){document.getElementById('viewWallet').style.display=t==='wallet'?'block':'none';document.getElementById('viewPays').style.display=t==='pays'?'block':'none';document.getElementById('viewProfil').style.display=t==='profil'?'block':'none';document.getElementById('tabW').classList.toggle('on',t==='wallet');document.getElementById('tabP').classList.toggle('on',t==='pays');document.getElementById('tabR').classList.toggle('on',t==='profil');}
function refresh(){document.getElementById('soldeTxt').innerText=solde.toLocaleString('fr-FR')+' FCFA';localStorage.setItem('sal_v27_solde',solde);load();}
function saveProfile(){localStorage.setItem('profName',document.getElementById('profName').value);localStorage.setItem('profPhone',document.getElementById('profPhone').value);alert('Sauvé');switchTab('wallet');}
function openS(n){cur=n;document.getElementById('mTitle').innerText=n;document.getElementById('modal').classList.add('on');}
function closeM(){document.getElementById('modal').classList.remove('on');}
document.getElementById('mont').addEventListener('input',()=>{let m=parseInt(document.getElementById('mont').value)||0;let f=Math.round(m*0.2);document.getElementById('calc').innerHTML=m?`Frais 20%: ${f}F | Total: ${m+f}F`:'';});
function doTrans(){let num=document.getElementById('num').value.trim();let m=parseInt(document.getElementById('mont').value);if(!num||!m)return alert('Numéro + Montant');let fee=Math.round(m*0.2);let total=m+fee;let id='SLM-'+Math.floor(1000000+Math.random()*8999999);if(cur==='Encaisser'){solde+=m;fee=0;total=m;}else{if(m>solde)return alert('Solde insuffisant');solde-=total;}let rec={id,service:cur,amount:m,fee,total,phone:num,village:currentLoc.village,date:new Date().toLocaleString('fr-FR')};let arr=JSON.parse(localStorage.getItem('sal_v27_recus')||'[]');arr.unshift(rec);localStorage.setItem('sal_v27_recus',JSON.stringify(arr));refresh();closeM();document.getElementById('rDetail').innerHTML=`${rec.id}<br>Service: ${rec.service}<br>Village: ${rec.village}<br>Num: ${rec.phone}<br>Montant: ${rec.amount}F<br>Total: ${rec.total}F<br>Date: ${rec.date}`;document.getElementById('receiptView').classList.add('on');}
function load(){let arr=JSON.parse(localStorage.getItem('sal_v27_recus')||'[]');document.getElementById('nbT').innerText=arr.length+' transac';document.getElementById('list').innerHTML=arr.map(r=>`<div style="background:#1a1a1a;padding:8px;border-radius:8px;margin:4px 0">${r.service} - ${r.amount}F - ${r.village}</div>`).join('')||'Aucun';}
window.addEventListener('load', init);
</script></body></html>
